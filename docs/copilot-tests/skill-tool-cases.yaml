        must: [[tiết kiệm]]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S09
    question: Bây giờ thiết bị nào đang chạy?
    expect:
      retrieval: {skill: live_status, rank_max: 1, decision: choose}
      tools:
        calls: [{name: nilm_latest, args: {minutes: 15}}]
      answer:
        must: [[không có dữ liệu, chưa có dữ liệu], [04/11]]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S10
    question: Thời tiết mai thế nào?
    expect:
      retrieval: {decision: none}
      tools: {calls: [], forbid: ["*"]}
      answer:
        must: [[chỉ trả lời được các câu hỏi về điện]]
    budget_ms: 1500
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S11
    question: Cái máy đó dùng bao nhiêu?
    expect:
      retrieval: {skill: usage_query, rank_max: 1, decision: choose}
      tools:
        calls: [{name: query_usage, args: {unclear: true}}]
      answer:
        clarification: {reason: which_device, options: [Dishwasher, Kettle, Microwave, Washing Machine]}
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S12
    turns: [may giat hom qua]
    question: Còn hôm kia?
    expect:
      rewrite: {method: rule, devices: [Washing Machine], start: 2026-11-03, end: 2026-11-03}
      retrieval: {skill: usage_query, rank_max: 4, note: also kept as the previous turn's skill}
      tools:
        calls: [{name: query_usage, args: {devices: [Washing Machine], start: 2026-11-03, end: 2026-11-03}}]
      answer:
        numbers: [{oracle: "Washing Machine kWh on 2026-11-03 (device_estimate_1d)", tol: 0.01, unit: kWh}]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S13
    fixture: {add_household_skill: kitchen_report}
    question: Báo cáo bếp tuần qua
    expect:
      retrieval: {skill: kitchen_report, rank_max: 1, decision: choose}
      tools:
        calls: [{name: query_usage, args: {devices: [Kettle, Microwave], group_by: device, start: 2026-10-29, end: 2026-11-04}}]
      answer:
        numbers:
          - {value: 5.20, tol: 0.01, unit: kWh, note: Kettle, NILM estimate}
          - {oracle: "Microwave kWh 2026-10-29..11-04 (best source)", tol: 0.01, unit: kWh}
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S14
    home: other
    fixture: {add_household_skill: kitchen_report, to_home: demo}
    question: Báo cáo bếp tuần qua
    expect:
      retrieval: {absent: [kitchen_report]}
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S15
    fixture: {disable_system_skill: savings_advice}
    question: Làm sao để tiết kiệm điện?
    expect:
      retrieval: {absent: [savings_advice]}
      tools: {forbid: [read_suggestions]}
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S16
    question: Báo cho tôi nếu ban đêm dùng quá 200 W
    expect:
      retrieval: {skill: alerts, rank_max: 1, decision: choose}
      tools:
        calls: [{name: create_alert, args: {threshold_w: 200, start_hour: 0, end_hour: 5}, executed: false}]
      answer:
        confirm_card: {tool: create_alert}
      db: {"insight.alert rows for the home": 0}
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

