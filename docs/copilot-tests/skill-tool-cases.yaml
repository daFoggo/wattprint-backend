# Chat test cases for the skill and tool registry
# (spec: docs/superpowers/specs/2026-11-07-copilot-skill-tool-registry-design.md, section 6).
#
# Fixture: the demo home from the legacy dump (REFIT House 2), data 2026-10-29 .. 2026-11-04,
# COPILOT_TODAY=2026-11-05, billing cycle starts on day 1. Tracked appliances: Dishwasher, Kettle,
# Microwave, Washing Machine. A second home "other" (empty) is used for isolation.
#
# One graph (spec section 5): ingress → load_context → rewrite_question → find_skills → decide ⇄ act →
# generate_answer → guard_output → suggest_followups → save_turn. trigger: chat (default) | schedule | confirm.
#
# Runner: `python -m app.cli.copilot_skills eval` asks each case through POST /api/v1/copilot/ask,
# reads the turn's copilot.tool_call rows (skill_search + tool calls) and the steps timings, fills the
# `actual:` block of every case and writes skill-tool-results.{md,json}.
#
# Expected numbers for usage, bill and advice questions are what the current Text2SQL Copilot returned
# (docs/copilot-tests/results.json, 17/17 pass). New skills use the `oracle` given in the case.
#
# Fields
#   turns:            earlier user turns in the same conversation (asked first, not scored)
#   fixture:          changes before the case (household skills, switches); undone after
#   expect.rewrite:   standalone question must name these devices / dates (rewrite_question node)
#   expect.short_memory / long_memory: what load_context / recall_memory must put in the state
#   expect.retrieval: skill = expected skill code; rank_max = must be within this RRF rank;
#                     decision = direct | choose | none; absent = skills that must NOT be candidates
#   expect.tools:     calls in order (ordered: true) or as a set; args = key arguments compared exactly;
#                     forbid = tools that must not run
#   expect.answer:    numbers {value, tol} or {oracle, tol}; must = phrases (any listed form); lang
#   budget_ms:        end-to-end latency budget for this case
#   actual:           filled by the runner

defaults:
  home: demo
  lang: vi
  budget_ms: 3500

household_skills:
  kitchen_report:
    name: Báo cáo bếp
    description: Điện năng của các thiết bị trong bếp (ấm đun nước, lò vi sóng) theo từng thiết bị.
    examples: [báo cáo bếp, bếp tuần qua tốn bao nhiêu điện, đồ bếp dùng bao nhiêu]
    tools:
      - tool: query_usage
        preset: {devices: [Kettle, Microwave], group_by: device, measure: energy}

cases:
  - id: S01
    question: Hôm qua nhà tôi dùng bao nhiêu điện?
    expect:
      retrieval: {skill: usage_query, rank_max: 1, decision: choose}
      tools:
        calls: [{name: query_usage, args: {target: whole_home, start: 2026-11-04, end: 2026-11-04, measure: energy}}]
      answer:
        numbers: [{value: 17.25, tol: 0.01, unit: kWh}]
        must: [[04/11, 4/11], [công tơ tổng, cả nhà]]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S02
    question: Ngày nào tuần qua dùng nhiều điện nhất?
    expect:
      retrieval: {skill: usage_query, rank_max: 1, decision: choose}
      tools:
        calls: [{name: query_usage, args: {grain: day, order: desc, top_n: 1, start: 2026-10-29, end: 2026-11-04}}]
      answer:
        numbers: [{value: 36.72, tol: 0.01, unit: kWh}]
        must: [[30/10]]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S03
    question: may giat hom qua
    note: no tone marks, no verb; rewrite_question links the device and the date by rules (no LLM)
    expect:
      rewrite: {method: rule, devices: [Washing Machine], start: 2026-11-04, end: 2026-11-04}
      retrieval: {skill: usage_query, rank_max: 1, decision: choose}
      tools:
        calls: [{name: query_usage, args: {devices: [Washing Machine], start: 2026-11-04, end: 2026-11-04}}]
      answer:
        numbers: [{value: 1.62, tol: 0.01, unit: kWh}]
        must: [[ước tính, NILM]]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S04
    question: Tháng này tiền điện bao nhiêu?
    expect:
      retrieval: {skill: bill_explain, rank_max: 1, decision: choose}
      tools:
        calls: [{name: compute_bill}]  # day defaults to the latest day with data
        forbid: [query_usage]
      answer:
        numbers: [{value: 66.92, tol: 0.01, unit: kWh}, {value: 137386, tol: 1, unit: đ}]
        must: [[VAT]]
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S05
    question: Vì sao hoá đơn tháng này cao?
    expect:
      retrieval: {skill: bill_explain, rank_max: 2, decision: choose}
      tools:
        ordered: false
        calls:
          - {name: compute_bill}
          - {name: bill_by_tier}
          - {name: query_usage, args: {grain: day, start: 2026-11-01, end: 2026-11-04}}
      answer:
        numbers: [{oracle: "kWh of the highest day 2026-11-01..04 (reading_1d, kind=main)", tol: 0.01}]
        must: [[bậc]]
    budget_ms: 6000
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S06
    question: Cuối tháng tiền điện khoảng bao nhiêu?
    expect:
      retrieval: {skill: forecast_bill, rank_max: 1, decision: choose}
      tools:
        ordered: true
        calls:
          - {name: usage_to_date}
          - {name: forecast_usage, args: {method: mean_last_7_days}}
          - {name: search_price}
          - {name: price_kwh}
      answer:
        numbers:
          - {value: 601.6, tol: 1.0, unit: kWh, note: "66.92 + 26 × 143.96 / 7"}
          - {oracle: "tiered price of 601.6 kWh at the home's tariff version on 2026-11-01, VAT included", tol: 100, unit: đ}
        must: [[dự báo, ước tính], [30/11, cuối tháng, hết tháng]]
    budget_ms: 6000
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

  - id: S07
    question: Mỗi ngày phải giảm bao nhiêu để không lên bậc?
    expect:
      retrieval: {skill: tier_guard, rank_max: 2, decision: choose}
      tools:
        ordered: true
        calls: [{name: forecast_usage}, {name: search_price}, {name: tier_gap}]
      answer:
        numbers: [{oracle: "(forecast 601.6 − lower bound of the forecast's tier) / 26 days", tol: 0.1, unit: kWh/ngày}]
        must: [[bậc]]
    budget_ms: 6000
    actual: {skill: null, decision: null, candidates: [], tools: [], answer: null, latency_ms: null, pass: null}

