<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wappi-chat-title wappi-chat-desc" id="wappi-chat-root">
        <title id="wappi-chat-title">Một lượt chat với Wappi</title>
        <desc id="wappi-chat-desc">Dashboard gửi câu hỏi tới API; API che dữ liệu cá nhân, chạy guard, vòng lặp gọi LLM và công cụ đọc dữ liệu rồi stream câu trả lời về dashboard.</desc>
        <defs>
      <style>#wappi-chat-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #wappi-chat-root { font-family: var(--font-sans); color: var(--color-ink); }
      #wappi-chat-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#wappi-chat-root .diagram-container { overflow-x: visible; }
}</style>
