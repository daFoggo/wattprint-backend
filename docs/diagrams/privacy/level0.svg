<rect class="process" x="560" y="50" width="280" height="84" rx="9"/><text class="label" x="700.0" y="89.0" text-anchor="middle">1. Thu số đo</text><text class="sub" x="700.0" y="107.0" text-anchor="middle">bỏ lô trước mốc xóa</text>
