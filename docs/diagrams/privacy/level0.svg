<rect class="external" x="1090" y="886" width="310" height="84" rx="9"/><text class="label" x="1245.0" y="925.0" text-anchor="middle">OpenRouter / AstralX</text><text class="sub" x="1245.0" y="943.0" text-anchor="middle">ngoài hệ thống</text>
<text class="sub" x="20" y="1004" text-anchor="start">Kho lặp lại ở nhiều dòng là cùng một kho. Thời hạn theo bậc (thô 30, phút 90, giờ 400, ngày 800 ngày) CHƯA áp dụng.</text>
