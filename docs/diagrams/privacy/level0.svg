<rect class="store" x="1090" y="450" width="310" height="84" rx="9"/><text class="label" x="1245.0" y="489.0" text-anchor="middle">D8 Dự báo, cảnh báo, lượt chạy</text><text class="sub" x="1245.0" y="507.0" text-anchor="middle">không hạn</text>
