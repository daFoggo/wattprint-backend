<rect class="store" x="20" y="150" width="290" height="84" rx="9"/><text class="label" x="165.0" y="189.0" text-anchor="middle">D1 Thô</text><text class="sub" x="165.0" y="207.0" text-anchor="middle">400 ngày</text>
