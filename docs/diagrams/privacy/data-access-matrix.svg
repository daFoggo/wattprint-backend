<text class="sub" x="20" y="760" text-anchor="start">CHƯA ÁP DỤNG (spec R1.1, đợt Đ7): thô 30 ngày, phút và lượt bật/tắt 90, giờ 400, ngày 800. Hôm nay chỉ số thô và tổng phút có hạn xóa (400 ngày).</text>
<text class="sub" x="20" y="778" text-anchor="start">&quot;X&quot; của chủ nhà là xóa lịch sử trước một ngày hoặc tất cả (nhà demo bị từ chối), hoặc xóa tài khoản. Người bảo trì máy chủ đọc được mọi kho bằng quyền database.</text>
<text class="sub" x="20" y="796" text-anchor="start">Dịch vụ ngoài không truy cập kho nào: họ chỉ nhận bản sao trong từng lời gọi.</text>
</svg>
