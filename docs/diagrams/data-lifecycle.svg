<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Vòng đời dữ liệu</title><desc>Thô nén sau 2 ngày và xóa sau 400 ngày; aggregate 1 phút nén sau 14 ngày; 1 giờ và 1 ngày giữ vô hạn</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="590" fill="#FFFFFF"/>
<text x="20" y="62" font-size="13" font-weight="600" fill="#5F5E5A" text-anchor="start">tuổi của dữ liệu</text>
<line x1="20" y1="74" x2="280" y2="74" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="409.0" y="62" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">0 → 2 ngày</text>
<line x1="300" y1="74" x2="518" y2="74" stroke="#B4B2A9" stroke-width="2"/>
<text x="635.0" y="62" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">2 → 14 ngày</text>
<line x1="526" y1="74" x2="744" y2="74" stroke="#B4B2A9" stroke-width="2"/>
<text x="861.0" y="62" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">14 → 400 ngày</text>
<line x1="752" y1="74" x2="970" y2="74" stroke="#B4B2A9" stroke-width="2"/>
<text x="1087.0" y="62" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">sau 400 ngày</text>
<line x1="978" y1="74" x2="1196" y2="74" stroke="#B4B2A9" stroke-width="2"/>
<text x="20" y="126" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start">energy.reading</text>
<text x="20" y="148" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start">energy.device_estimate</text>
<text x="20" y="167" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">dữ liệu thô</text>
<g>
<rect x="300" y="96" width="218" height="78" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="409.0" y="142" font-size="16" font-weight="700" fill="#085041" text-anchor="middle">chưa nén</text>
</g>
<g>
<rect x="526" y="96" width="218" height="78" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.4"/>
<text x="635.0" y="130" font-size="16" font-weight="700" fill="#04342C" text-anchor="middle">nén ~17x</text>
<text x="635.0" y="154" font-size="13.5" font-weight="400" fill="#085041" text-anchor="middle">segmentby series_id</text>
</g>
<g>
<rect x="752" y="96" width="218" height="78" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.4"/>
<text x="861.0" y="130" font-size="16" font-weight="700" fill="#04342C" text-anchor="middle">nén ~17x</text>
<text x="861.0" y="154" font-size="13.5" font-weight="400" fill="#085041" text-anchor="middle">segmentby series_id</text>
</g>
<g>
<rect x="978" y="96" width="218" height="78" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1087.0" y="130" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">bị xóa</text>
<text x="1087.0" y="154" font-size="13.5" font-weight="400" fill="#5F5E5A" text-anchor="middle">drop_chunks</text>
</g>
<text x="20" y="222" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start">reading_1m</text>
<text x="20" y="244" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start">device_estimate_1m</text>
<text x="20" y="263" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">aggregate 1 phút</text>
<g>
<rect x="300" y="192" width="218" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="409.0" y="238" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">chưa nén</text>
</g>
<g>
<rect x="526" y="192" width="218" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="635.0" y="238" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">chưa nén</text>
</g>
<g>
<rect x="752" y="192" width="218" height="78" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="1.4"/>
<text x="861.0" y="238" font-size="16" font-weight="700" fill="#26215C" text-anchor="middle">nén ~19–23x</text>
</g>
<g>
<rect x="978" y="192" width="218" height="78" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1087.0" y="226" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">bị xóa</text>
<text x="1087.0" y="250" font-size="13.5" font-weight="400" fill="#5F5E5A" text-anchor="middle">bucket 1 phút</text>
</g>
<text x="20" y="318" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start">reading_1h · 1d</text>
<text x="20" y="340" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start">device_estimate_1h · 1d</text>
<text x="20" y="359" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">aggregate giờ, ngày</text>
<g>
<rect x="300" y="288" width="896" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="748.0" y="334" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">giữ vô hạn · không nén (rất nhỏ)</text>
</g>
<text x="20" y="410" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start">Job refresh chạy nền</text>
<g>
<rect x="20" y="424" width="285" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="34" y="449" font-size="15" font-weight="700" fill="#0C447C" text-anchor="start">Aggregate 1 phút</text>
<text x="34" y="471" font-size="13.5" font-weight="400" fill="#185FA5" text-anchor="start">mỗi phút · cửa sổ 7 ngày gần nhất</text>
</g>
<g>
<rect x="320" y="424" width="285" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="334" y="449" font-size="15" font-weight="700" fill="#0C447C" text-anchor="start">Aggregate 1 giờ</text>
<text x="334" y="471" font-size="13.5" font-weight="400" fill="#185FA5" text-anchor="start">mỗi giờ · cửa sổ 30 ngày gần nhất</text>
</g>
<g>
<rect x="620" y="424" width="285" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="634" y="449" font-size="15" font-weight="700" fill="#0C447C" text-anchor="start">Aggregate 1 ngày</text>
<text x="634" y="471" font-size="13.5" font-weight="400" fill="#185FA5" text-anchor="start">mỗi giờ · cửa sổ 60 ngày gần nhất</text>
</g>
<circle cx="28" cy="517" r="4" fill="#5F5E5A"/>
<text x="42" y="522" font-size="14.5" fill="#2C2C2A"><tspan font-weight="700">Retention luôn là drop_chunks theo policy, </tspan>không DELETE từng dòng.</text>
<circle cx="28" cy="541" r="4" fill="#5F5E5A"/>
<text x="42" y="546" font-size="14.5" fill="#2C2C2A"><tspan font-weight="700">Aggregate 1m nén sau 14 ngày, </tspan>luôn lớn hơn cửa sổ refresh 7 ngày để job không gặp vùng đã nén.</text>
<circle cx="28" cy="565" r="4" fill="#5F5E5A"/>
<text x="42" y="570" font-size="14.5" fill="#2C2C2A"><tspan font-weight="700">insight.device_cycle </tspan>là hypertable chunk 30 ngày, hiện chưa có policy nén hay xóa.</text>
</svg>
