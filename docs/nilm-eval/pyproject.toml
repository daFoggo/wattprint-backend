[project]
name = "nilm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "torch>=2.15.0",
    "xformers>=0.0.36",
    "tqdm>=4.70.1",
    "ipywidgets>=8.1.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 200
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
