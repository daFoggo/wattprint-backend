name: wattprint

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: wattprint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - wattprint_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  auth:
    build: ./auth
    container_name: wattprint-auth
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      API_AUDIENCE: ${API_AUDIENCE:-wattprint-api}
      EXPO_APP_SCHEMES: ${EXPO_APP_SCHEMES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: 3000
    ports:
      - "${AUTH_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./auth/src:/app/src
    command: sh -c "npm run migrate && npm run dev"

  api:
    build: ./backend
    container_name: wattprint-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_JWKS_URL: http://auth:3000/api/auth/jwks
      AUTH_ISSUER: ${BETTER_AUTH_URL}
      AUTH_AUDIENCE: ${API_AUDIENCE:-wattprint-api}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /code/app"

volumes:
  wattprint_pgdata:
