name: wattprint

x-copilot-env: &copilot-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
  TEXT2SQL_URL: ${TEXT2SQL_URL:-http://host.docker.internal:11101}
  TEXT2SQL_CONNECTION_ID: ${TEXT2SQL_CONNECTION_ID:-}
  TEXT2SQL_SERVICE_KEY: ${TEXT2SQL_SERVICE_KEY:-}
  ASTRALX_API_KEY: ${ASTRALX_API_KEY:-}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
  FEEDBACK_TELEGRAM_TOKEN: ${FEEDBACK_TELEGRAM_TOKEN:-}
  FEEDBACK_TELEGRAM_CHAT: ${FEEDBACK_TELEGRAM_CHAT:-}
  COPILOT_DATABASE_URL: postgresql+asyncpg://wattprint_copilot_ro:${COPILOT_DB_PASSWORD:-}@db:11096/${POSTGRES_DB}

services:
  db:
    image: timescale/timescaledb:2.31.0-pg18
    container_name: wattprint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: ${DB_PORT:-11096}
    # Loopback for host tools; docker0 for wattprint-text2sql-mcp (its source connection is 172.17.0.1:11096).
    ports:
      - "127.0.0.1:${DB_PORT:-11096}:${DB_PORT:-11096}"
      - "172.17.0.1:${DB_PORT:-11096}:${DB_PORT:-11096}"
    volumes:
      # PG18 images keep PGDATA at /var/lib/postgresql/18/docker, so the volume mounts one level up.
      - wattprint_pg18data:/var/lib/postgresql
    # timescale/timescaledb#10500: PG18-only planner error on some DISTINCT/GROUP BY + ORDER BY over caggs.
    # Overrides timescaledb-tune, which sized the conf for the whole shared host (shared_buffers 24GB).
    command: ["postgres", "-c", "timescaledb.enable_cagg_reorder_groupby=off",
              "-c", "shared_buffers=2GB", "-c", "effective_cache_size=4GB",
              "-c", "maintenance_work_mem=256MB", "-c", "work_mem=16MB",
              "-c", "max_parallel_workers=4", "-c", "max_parallel_workers_per_gather=2"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak-db:
    image: postgres:18-alpine
    container_name: wattprint-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      POSTGRES_DB: keycloak
      PGPORT: "11097"
    volumes:
      - wattprint_keycloak_pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: wattprint-keycloak
    restart: unless-stopped
    # Production mode. TLS ends at the host nginx (KC_HTTP_ENABLED + KC_PROXY_HEADERS); KC_HOSTNAME fixes the issuer.
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Replaces ${WATTPRINT_ADMIN_PASSWORD} in the imported realm file (the app-level admin user).
      WATTPRINT_ADMIN_PASSWORD: ${WATTPRINT_ADMIN_PASSWORD:?WATTPRINT_ADMIN_PASSWORD is required}
      # Secret of the confidential web client `wattprint-web` (the Next.js dashboard).
      WATTPRINT_WEB_CLIENT_SECRET: ${WATTPRINT_WEB_CLIENT_SECRET:?WATTPRINT_WEB_CLIENT_SECRET is required}
      # Secret of the service account `wattprint-demo-admin` (creates and deletes demo guests).
      DEMO_ADMIN_CLIENT_SECRET: ${DEMO_ADMIN_CLIENT_SECRET:?DEMO_ADMIN_CLIENT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:11097/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Fixed public URL = stable `iss`; the API still reaches Keycloak as http://keycloak:11095.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:11095}
      # The admin console stays on localhost (nginx 404s /admin and /realms/master on the public domain).
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:11095}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Behind the host nginx (TLS ends there): trust its X-Forwarded-* headers.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "11095"
      # Read by the WattPrint login theme (links home, terms, privacy).
      WATTPRINT_LANDING_URL: ${WATTPRINT_LANDING_URL:-http://localhost:11091}
      # Mail for sign-up verification and password reset. Dev default: the mailpit service below; production: real SMTP.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@wattprint.local}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    ports:
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-11095}:11095"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # The login theme jar, built by wattprint-web (`pnpm --filter keycloak-theme build:jar`).
      - ./keycloak/providers:/opt/keycloak/providers:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  mailpit:
    # Dev SMTP: catches every mail Keycloak sends (verify email, reset password). Inbox: http://localhost:11099
    image: axllent/mailpit:v1.27.4
    container_name: wattprint-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_PORT:-11099}:8025"

  api:
    build: .
    container_name: wattprint-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:11096/${POSTGRES_DB}
      # Issuer = the URL clients (the phone) use; JWKS = how this container reaches Keycloak.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:11095/realms/wattprint}
      KEYCLOAK_JWKS_URL: http://keycloak:11095/realms/wattprint/protocol/openid-connect/certs
      NILM_MODEL_DIR: /data/models/nilm # the bundles' JSON sidecars: each device type's held-out score
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-}
      COPILOT_DB_PASSWORD: ${COPILOT_DB_PASSWORD:-}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      REFIT_SEED_DIR: /data
      # The House 2 seed revision is opt-in: demo homes come from scripts/seed_demo_homes.py.
      SEED_REFIT: ${SEED_REFIT:-0}
      # Demo guests (POST /api/v1/demo/homes/{key}/guest): made through the web client and the
      # `wattprint-demo-admin` service account; either empty = 503.
      WATTPRINT_WEB_CLIENT_SECRET: ${WATTPRINT_WEB_CLIENT_SECRET:-}
      DEMO_ADMIN_CLIENT_SECRET: ${DEMO_ADMIN_CLIENT_SECRET:-}
      <<: *copilot-env
    extra_hosts:
      - "host.docker.internal:host-gateway" # text2sql runs in its own compose project
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-11093}:11093"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./tests:/code/tests
      - ./scripts:/code/scripts
      - ./dataset:/data:ro
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 11093 --reload --reload-dir /code/app --timeout-graceful-shutdown 3"

  replay:
    # The demo homes' meters (REFIT played back at clock time). Its own container, so an api restart or a
    # reboot no longer stops the readings; its DB lock refuses a second copy.
    build: .
    container_name: wattprint-replay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:11096/${POSTGRES_DB}
      REFIT_SEED_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./scripts:/code/scripts
      - ./dataset:/data:ro
    command: python -m scripts.replay_refit

  insight:
    # Insight worker: bills, forecasts, cohorts, alerts, weather and mail, each on its own cadence.
    build: .
    container_name: wattprint-insight
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:11096/${POSTGRES_DB}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:11092}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@wattprint.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      <<: *copilot-env # the watches job runs custom queries as the copilot role
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started # runs the migrations
    volumes:
      - ./app:/code/app
    restart: unless-stopped
    command: python -m app.modules.insight.worker

  nilm:
    # NILM worker: disaggregates every home's main meter into device estimates (CPU torch).
    build:
      context: .
      args:
        WITH_NILM: "1"
    image: wattprint-nilm
    container_name: wattprint-nilm
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:11096/${POSTGRES_DB}
      NILM_MODEL_DIR: /data/models/nilm
      NILM_THREADS: ${NILM_THREADS:-4}
      NILM_HISTORY_DAYS: ${NILM_HISTORY_DAYS:-365} # a home's first pass; homes with a checkpoint go on from it
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started # runs the migrations
    volumes:
      - ./app:/code/app
      - ./scripts:/code/scripts # scripts.backfill_nilm needs torch, which only this image has
      - ./dataset:/data:ro
    restart: unless-stopped
    command: python -m app.modules.nilm.worker

networks:
  default:
    # Explicit subnet: the host's default Docker address pools are exhausted by other projects.
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.254.93.0/24}

volumes:
  wattprint_pg18data:
  wattprint_keycloak_pg18data:
