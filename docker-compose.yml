name: wattprint

services:
  db:
    image: timescale/timescaledb:2.31.0-pg18
    container_name: wattprint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: ${DB_PORT:-11096}
    ports:
      - "${DB_PORT:-11096}:${DB_PORT:-11096}"
    volumes:
      # PG18 images keep PGDATA at /var/lib/postgresql/18/docker, so the volume mounts one level up.
      - wattprint_pg18data:/var/lib/postgresql
    # timescale/timescaledb#10500: PG18-only planner error on some DISTINCT/GROUP BY + ORDER BY over caggs.
    # Overrides timescaledb-tune, which sized the conf for the whole shared host (shared_buffers 24GB).
    command: ["postgres", "-c", "timescaledb.enable_cagg_reorder_groupby=off",
              "-c", "shared_buffers=2GB", "-c", "effective_cache_size=4GB",
              "-c", "maintenance_work_mem=256MB", "-c", "work_mem=16MB",
              "-c", "max_parallel_workers=4", "-c", "max_parallel_workers_per_gather=2"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak-db:
    image: postgres:18-alpine
    container_name: wattprint-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      POSTGRES_DB: keycloak
      PGPORT: "11097"
    volumes:
      - wattprint_keycloak_pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: wattprint-keycloak
    # start-dev: HTTP and relaxed checks. Production needs `start`, TLS and a real hostname.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Replaces ${WATTPRINT_ADMIN_PASSWORD} in the imported realm file (the app-level admin user).
      WATTPRINT_ADMIN_PASSWORD: ${WATTPRINT_ADMIN_PASSWORD:?WATTPRINT_ADMIN_PASSWORD is required}
      # Secret of the confidential web client `wattprint-web` (the Next.js dashboard).
      WATTPRINT_WEB_CLIENT_SECRET: ${WATTPRINT_WEB_CLIENT_SECRET:?WATTPRINT_WEB_CLIENT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:11097/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Fixed public URL = stable `iss`; the API still reaches Keycloak as http://keycloak:11095.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:11095}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "11095"
    ports:
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-11095}:11095"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  api:
    build: .
    container_name: wattprint-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:11096/${POSTGRES_DB}
      # Issuer = the URL clients (the phone) use; JWKS = how this container reaches Keycloak.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:11095/realms/wattprint}
      KEYCLOAK_JWKS_URL: http://keycloak:11095/realms/wattprint/protocol/openid-connect/certs
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-}
      COPILOT_DB_PASSWORD: ${COPILOT_DB_PASSWORD:-}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      REFIT_SEED_DIR: /data
    ports:
      - "${API_PORT:-11093}:11093"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./tests:/code/tests
      - ./dataset:/data:ro
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 11093 --reload --reload-dir /code/app"

networks:
  default:
    # Explicit subnet: the host's default Docker address pools are exhausted by other projects.
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.254.93.0/24}

volumes:
  wattprint_pg18data:
  wattprint_keycloak_pg18data:
