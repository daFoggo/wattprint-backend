[project]
name = "wattprint-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "pgvector>=0.5.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "langgraph>=1.2",
    "langchain-openai>=1.0",
    "sqlglot>=27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PyTorch for the NILM replay and the Copilot embedder. Exactly one of the two builds is installed:
#   uv sync --extra cpu   (default in the Dockerfile)
#   uv sync --extra gpu   (CUDA 13.0 wheels; needs the NVIDIA driver and container toolkit)
# sentence-transformers: the Copilot embedder (bge-m3); it needs torch, so it rides along
cpu = ["torch>=2.5", "sentence-transformers>=3.0"]
gpu = ["torch>=2.5", "sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "langgraph-cli[inmem]>=0.4.42",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not audit'"
markers = ["audit: long-running database audit (run with -m audit against the audit server)"]
