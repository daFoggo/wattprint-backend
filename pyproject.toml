[project]
name = "wattprint-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.15",
    "pgvector>=0.5.1",
    # REFIT seed revision (alembic/versions/updates) reads the CSV with pandas
    "pandas>=3.1.1",
]

[dependency-groups]
# NILM training/inference only; kept out of the API image (Dockerfile syncs default groups)
nilm = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    "xformers>=0.0.35",
    "tqdm>=4.66",
]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# research model code keeps its original naming (GRUDetector.py, B/L tensor-shape args) and line length
"app/ml/**" = ["N999", "N803", "N812", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not audit'"
markers = ["audit: long-running database audit (run with -m audit against the audit server)"]
