name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen --only-group dev
      # the same three checks as "verify" in .claude/sdlc.json
      - run: uv run ruff check app tests alembic scripts
      - run: uv run ruff format --check app tests alembic scripts
      - run: uv run python scripts/check_boundaries.py
# shortcut: pytest is not here, the suite needs TimescaleDB + pgvector and the roles of
# tests/conftest.py; run it in the api container (AGENTS.md) until a service-container job exists.
