# Demo homes replayed from REFIT (scripts/seed_demo_homes.py), named as in the dataset: the house
# number and the appliance names of CLEAN_READ_ME_081116.txt. Only the time is moved, onto Vietnam
# time (scripts/refit.py). Profile fields REFIT does not give (province, floor area, occupants) stay empty.
# Passwords: DEMO_PASSWORD in .env (Keycloak policy: 12+ chars, upper, lower, digit, special).
# Real accounts to add as members of the first home: DEMO_EXTRA_MEMBERS="a@x.com,b@y.com" in .env.

# A year: the expected-usage model (app/modules/expect) needs every season. Re-seeding only adds
# the older readings; stored ones and each home's shift are kept.
history_days = 365
# Model for homes without one of their own (tb_nilm_model with home_id NULL), relative to
# dataset/models/nilm (NILM_MODEL_DIR in the nilm container).
shared_model = "house2/nilm_pipeline.pt"

[[home]]
house = 2
model = "house2/nilm_pipeline.pt"
owner = { email = "refit.house2@wattprint.local", name = "REFIT House 2" }
members = [{ email = "refit.house2.member@wattprint.local", name = "REFIT House 2 member" }]
# NILM label -> the REFIT name of that appliance in this house ("Other" is the model's remainder)
devices = { Fridge = "Fridge-Freezer", WashMach = "Washing Machine", Dishwash = "Dishwasher", Microwave = "Microwave", Toaster = "Toaster", Kettle = "Kettle", Other = "Other" }

[[home]]
house = 5
model = "house5/nilm_pipeline.pt"
owner = { email = "refit.house5@wattprint.local", name = "REFIT House 5" }
members = []
devices = { Fridge = "Fridge-Freezer", WashMach = "Washing Machine", Dishwash = "Dishwasher", Microwave = "Microwave", Toaster = "Toaster", Kettle = "Kettle", Other = "Other" }

# Homes from other countries (scripts/plegma_to_refit.py and enertalk_to_refit.py make their
# CSVs: house 100 + n for Plegma, 200 + n for ENERTALK). The recording's own clock is read as Vietnam
# time, as for REFIT. Train first: uv run --group nilm python dataset/training/train_house.py --house 101
# Plegma (Greece, CC BY 4.0): split ACs added up to one, a boiler, fridge, washing machine.
[[home]]
house = 101
name = "Plegma House 1 · Hy Lạp"
# Recorded Jul 2022 - Sep 2023: a 4-year shift puts it over now; the weather is Athens' on the CSV's clock.
history_days = 120
site = { latitude = 37.98, longitude = 23.73, timezone = "Europe/Athens" }
model = "house101/nilm_pipeline.pt"
owner = { email = "plegma.house1@wattprint.local", name = "Plegma House 1" }
members = []
devices = { AC = "Điều hòa", Boiler = "Bình nóng lạnh", Fridge = "Tủ lạnh", WashMach = "Máy giặt", Other = "Other" }

# ENERTALK (Korea, CC0): a rice cooker and a kimchi fridge; 3 months of recording, so a short history.
[[home]]
house = 200
name = "ENERTALK House 0 · Hàn Quốc"
# Recorded Nov 2016 - Jan 2017: a 10-year shift puts it over now (live until about Jan 2027).
history_days = 30
site = { latitude = 37.57, longitude = 126.98, timezone = "Asia/Seoul" }
model = "house200/nilm_pipeline.pt"
owner = { email = "enertalk.house0@wattprint.local", name = "ENERTALK House 0" }
members = []
devices = { Fridge = "Tủ lạnh", Kimchi = "Tủ lạnh kimchi", WashMach = "Máy giặt", RiceCooker = "Nồi cơm điện", Microwave = "Lò vi sóng", Other = "Other" }

